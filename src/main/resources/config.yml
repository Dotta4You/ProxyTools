# Reload with /proxytools reload. Icons: icon.png / icon-maintenance.png in this folder.
# Text: &-codes, &#RRGGBB, <gradient:#RRGGBB:#RRGGBB>..</gradient>, <rainbow>..</rainbow>. Placeholders: %online% %max%

config-version: 1 # do not change
language: en # en, de, or your own lang/<code>.yml

motd:
  enabled: true
  mode: random # random | sequential | static (first entry only)
  interval-seconds: 4
  entries:
    - line1: "&6&lMy Network &8» &fWelcome!"
      line2: "&7Play now on &b%online%&7 online players"
    - line1: "&6&lMy Network &8» &fNew season is live!"
      line2: "&7Join now and have fun"
    - line1: "<gradient:#00c6ff:#0072ff>My Network</gradient>"
      line2: "&7%online%&7/&7%max% &7online &8- &7<rainbow>have fun!</rainbow>"
  max-players: -1 # -1 = proxy value, number = fixed, dynamic = online + headroom
  max-players-headroom: 1
  hover: # tooltip over the player count
    enabled: false
    mode: custom # custom | players (real online players)
    lines:
      - "&6&lMy Network"
      - "&7%online%/%max% players online"

maintenance:
  kick-on-enable: true # kick everyone without bypass when it turns on
  redirect-server: "" # send them to this backend instead of kicking; empty = kick
  version-text: "&cMaintenance" # replaces the version in the server list; empty = keep
  timer-warnings: [300, 60, 10] # seconds before the end of a timed maintenance
  schedule-warnings: [300, 60, 10] # seconds before the start of a scheduled one

  motd: # same options as above
    enabled: true
    mode: random
    interval-seconds: 4
    entries:
      - line1: "&6&lMy Network &8» &c&lMaintenance"
        line2: "&7We are working on the network, back soon!"
    max-players: -1
    max-players-headroom: 1
    hover:
      enabled: true
      mode: custom
      lines:
        - "&c&lMaintenance"
        - "&7The network is currently closed."
